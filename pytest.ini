[pytest]
testpaths = tests
markers =
    slow: integration or resource-heavy (orchestrator solve, large subprocess limits, real dataset smoke)
    structure: pipeline wiring, solve_problem contract, evaluation summary shape (tests/test_pipeline_structure.py)
    real_inference: local HF tiny model load (set RUN_REAL_INFERENCE=1; tests/test_real_inference_path.py)
