[pytest]
testpaths = tests
norecursedirs = node_modules dashboard/node_modules
filterwarnings =
    # sentencepiece (dependency of transformers/tokenizers) ships SWIG-generated CPython
    # bindings. On Python 3.11+, importing it emits DeprecationWarning about builtin Swig*
    # types lacking __module__. PyPI sentencepiece 0.2.1 is current; fixing requires upstream
    # wheels rebuilt with a newer SWIG (e.g. SWIG 4.4+). Not actionable in this repo until then.
    ignore:.*SwigPyPacked.*:DeprecationWarning
    ignore:.*SwigPyObject.*:DeprecationWarning
    ignore:.*swigvarlink.*:DeprecationWarning
markers =
    slow: integration or resource-heavy (orchestrator solve, large subprocess limits, real dataset smoke)
    structure: pipeline wiring, solve_problem contract, evaluation summary shape (tests/test_pipeline_structure.py)
    real_inference: local HF tiny model load (set RUN_REAL_INFERENCE=1; tests/test_real_inference_path.py)
