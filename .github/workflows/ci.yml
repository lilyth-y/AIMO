# CI: lint, tests, optional Docker build
name: CI

on:
  push:
    branches: [main, master, changes]
  pull_request:
    branches: [main, master, changes]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (imports)
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from evaluation.evaluation_utils import EvaluationMetrics, check_answer_correctness
          from evaluation.config import PROJECT_ROOT
          print('evaluation OK')
          "
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from pipeline.config import HF_MODEL_NAME
          print('pipeline config OK')
          "

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest tests/ -q --tb=short

      - name: Ralph accuracy gate (fixture)
        run: python scripts/ralph_accuracy_gate.py tests/fixtures/ralph_gate_pass.json

      - name: Ralph Tier 3 (Numina mock smoke + gate expect fail)
        env:
          PYTHONPATH: src
        run: python scripts/ralph_tier3_numina_smoke.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no GPU)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aimo:ci
          build-args: USE_GPU=false
        continue-on-error: true
